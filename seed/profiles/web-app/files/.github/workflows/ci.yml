name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Seed guard: milestone 0 adds this workflow before the app exists.
      # Milestone 1 task 1 (scaffold) removes this step and every
      # `if: steps.scaffold.outputs.ready == 'true'` line below.
      - name: Check for scaffold
        id: scaffold
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet; skipping until milestone 1 task 1."; fi

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.scaffold.outputs.ready == 'true'

      - name: Install Playwright Chromium
        if: steps.scaffold.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - run: npm run check
        if: steps.scaffold.outputs.ready == 'true'

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.scaffold.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.scaffold.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
